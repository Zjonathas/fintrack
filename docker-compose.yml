services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financas_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:///./financas.db
    networks:
      - financas_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financas_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - financas_network

networks:
  financas_network:
    driver: bridge
