<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle glow orb -->
  <circle cx="256" cy="256" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)" />

  <!-- Carteira / Cartão Central -->
  <g transform="translate(106, 116)">
    <!-- Cartão superior / traseiro -->
    <rect x="24" y="20" width="252" height="155" rx="24" fill="#064e3b" opacity="0.6" stroke="#059669" stroke-width="3" />
    
    <!-- Cartão principal em destaque -->
    <rect x="0" y="55" width="300" height="185" rx="28" fill="url(#primaryGrad)" />
    
    <!-- Detalhes do cartão -->
    <rect x="0" y="95" width="300" height="34" fill="#047857" opacity="0.85" />
    <rect x="36" y="150" width="48" height="36" rx="8" fill="#fef08a" opacity="0.9" />
    <circle cx="240" cy="170" r="16" fill="#ffffff" opacity="0.4" />
    <circle cx="260" cy="170" r="16" fill="#ffffff" opacity="0.3" />

    <!-- Moeda / Badge de Lucro com Símbolo $ -->
    <g transform="translate(185, 130)">
      <circle cx="45" cy="45" r="42" fill="#0b0f19" stroke="#10b981" stroke-width="6" filter="url(#glow)" />
      <circle cx="45" cy="45" r="32" fill="url(#cardGrad)" />
      <!-- Símbolo de Dinheiro / Cifrão -->
      <path d="M45,26 V64 M40,31 C40,31 43,29 46,29 C50,29 53,31 53,35 C53,42 38,40 38,47 C38,51 41,53 45,53 C49,53 52,51 52,51" 
            stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>
</svg>
